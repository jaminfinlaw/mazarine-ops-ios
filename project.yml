name: MazarineOPSMobile
options:
  bundleIdPrefix: co.mazarine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MazarineOPSMobile:
    type: application
    platform: iOS
    sources:
      - path: MazarineOPSMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.mazarine.ops.mobile
        INFOPLIST_KEY_CFBundleDisplayName: MAZARINE OPS
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MazarineOPSMobile/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Manrope.ttf
  MazarineOPSMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MazarineOPSMobileTests]
    dependencies:
      - target: MazarineOPSMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MazarineOPSMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MazarineOPSMobileUITests]
    dependencies:
      - target: MazarineOPSMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MazarineOPSMobile:
    build:
      targets:
        MazarineOPSMobile: all
    test:
      targets:
        - MazarineOPSMobileTests
        - MazarineOPSMobileUITests
